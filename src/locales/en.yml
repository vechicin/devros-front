hero-header: "Empowering your business with tailored AI solutions"
hero-subtitle: "From process automation and intelligent chatbots to AI consulting and team training, we help you unlock the full potential of artificial intelligence."
button: "Get in Touch"
about-header: "About Us"
about-subtitle: "Devros's mission is to empower businesses of all sizes through customized artificial intelligence solutions, helping them improve operational efficiency, reduce costs, enhance customer experience, and make smarter, data-driven decisions. We are passionate about democratizing AI, making its implementation accessible through strategic consulting and specialized training tailored to each organization."
services-header: "Our Services"
services-subtitle: "We specialize in the design and development of AI agents, smart chatbots, and process automation solutions that adapt to the specific requirements of each business:"
cards:
  automation:
    title: "Process Automation"
    description: "We optimize your operations with intelligent process automation, reducing time, costs, and errors, and boosting your business efficiency with tailor-made AI solutions."
  customer-service:
    title: "AI Agent/Chatbot - Customer Service"
    description: "We develop intelligent customer service chatbots that respond to inquiries 24/7, enhancing user experience and reducing the workload on your support teams."
  sales:
    title: "AI Agent/Chatbot - Sales and CRM"
    description: "Boost your sales with AI agents that manage prospects, qualify leads, and automate CRM tasks, improving conversion rates and customer follow-up."
  logistics:
    title: "AI Agent/Chatbot — Procurement and Logistics"
    description: "We implement intelligent chatbots that streamline procurement and logistics management, accelerating order processing, shipment tracking, and real-time inventory control."
  marketing:
    title: "AI Agent/Chatbot - Marketing"
    description: "Create personalized campaigns with AI-powered marketing agents. Automate responses, segment audiences, and enhance engagement across multiple channels."
  virtual-assistant:
    title: "AI Agent/Chatbot — Virtual Assistant"
    description: "We design intelligent virtual assistants that organize schedules, manage emails, and boost productivity for administrative tasks."
  legal-assistant:
    title: "AI Agent/Chatbot — Legal Assistant"
    description: "We offer AI-powered legal assistants that help draft documents, analyze contracts, and manage basic legal inquiries quickly and securely."
  consulting:
    title: "AI Consulting"
    description: "We guide you through the entire AI implementation process. Our consulting services adapt cutting-edge technology to your business needs."
  training:
    title: "AI Training"
    description: "We train your teams in artificial intelligence, helping them understand, adopt, and apply AI solutions to their daily operations."
  dashboards:
    title: "Smart Dashboard Development"
    description: "We build smart dashboards that integrate real-time data and predictive analytics, empowering better, faster, and more strategic decision-making."

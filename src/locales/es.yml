hero-header: "Implementamos soluciones de Inteligencia Artificial en tu negocio"
hero-subtitle: "Automatización de procesos, chatbots, consultoría en IA, entrenamiento en IA para tu empresa."
button: "Contáctanos"
about-header: Acerca De
about-subtitle: "En Devros, nuestra misión es potenciar a empresas de todos los tamaños mediante soluciones de inteligencia artificial personalizadas, mejorando la eficiencia operativa, reduciendo costos, optimizando la experiencia de los usuarios de nuestros clientes y tomando decisiones basadas en datos. Nos apasiona democratizar la inteligencia artificial, haciendo accesible su implementación a través de una consultoría estratégica y entrenamiento especializado en IA, adaptado a cada organización."
services-header: "Nuestros Servicios"
services-subtitle: "Nos especializamos en el diseño y desarrollo de agentes de IA, chatbots inteligentes, y soluciones de automatización de procesos que se adaptan a las necesidades específicas de cada negocio:"
cards:
  automation:
    title: "Automatización de Procesos"
    description: "Optimizamos tus operaciones mediante la automatización inteligente de procesos, reduciendo tiempos, costos y errores. Mejora la eficiencia de tu negocio con soluciones IA a la medida."
  customer-service:
    title: "Agente IA/Chatbot - Servicio al Cliente"
    description: "Desarrollamos chatbots inteligentes de atención al cliente que responden consultas 24/7, mejorando la experiencia de usuario y reduciendo la carga de trabajo de tus equipos."
  sales:
    title: "Agente IA/Chatbot - Ventas y CRM"
    description: "Impulsa tus ventas con agentes IA que gestionan prospectos, califican leads y automatizan tareas en tu CRM, mejorando la conversión y el seguimiento de clientes."
  logistics:
    title: "Agente IA/Chatbot - Gestión de Compras y Logística"
    description: "Implementamos chatbots inteligentes que optimizan la gestión de compras y logística, agilizando órdenes, seguimiento de envíos y control de inventarios en tiempo real."
  marketing:
    title: "Agente IA/Chatbot - Marketing"
    description: "Crea campañas personalizadas con agentes IA para marketing. Automatiza respuestas, segmenta audiencias y mejora la interacción con tus clientes en múltiples canales."
  virtual-assistant:
    title: "Agente IA/Chatbot - Asistente Virtual"
    description: "Desarrollamos asistentes virtuales inteligentes que organizan agendas, gestionan correos y mejoran la productividad en tareas administrativas."
  legal-assistant:
    title: "Agente IA/Chatbot - Asistente Legal"
    description: "Ofrecemos asistentes legales con IA que ayudan a redactar documentos, analizar contratos y gestionar solicitudes legales básicas de forma rápida y segura."
  consulting:
    title: "Consultoría en IA"
    description: "Te guiamos en todo el proceso de implementación de inteligencia artificial. Nuestro servicio de consultoría en IA adapta la tecnología a las necesidades de tu negocio."
  training:
    title: "Entrenamiento IA"
    description: "Capacitamos a tus equipos con entenamiento en inteligencia artificial, ayudándoles a comprender, adoptar y aplicar soluciones de IA en sus procesos diarios."
  dashboards:
    title: "Creación de Dashboards Inteligentes"
    description: "Desarrollamos dashboards inteligentes que integran datos en tiempo real y análisis predictivo, facilitando la toma de decisiones estratégicas basadas e inteligencia artificial."
how-it-works-header: "¿Cómo Funciona?"
how-it-works-subtitle: "Nuestro proceso optimizado garantiza que te entregamos soluciones de IA que se adaptan perfectamente a las necesidades de tu negocio."
understand-header: "Entender"
understand-subtitle: "Analizamos tus sistemas de soporte actuales y entendemos tus requisitos comerciales específicos."
design-header: "Diseñar"
design-subtitle: "Creamos flujos de trabajos personalizados y flujos de conversación adaptados a la experiencia de tus clientes."
develop-header: "Desarrollar"
develop-subtitle: "Creamos e integramos soluciones de IA que se conectan sin problemas con tus sistemas existenes."
support-header: "Soporte"
support-subtitle: "Brindamos soporte, actualizaciones y mejoras contínuas para garantizar un rendimiento óptimo."
